<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lune et Papier Éditions — Suivi des Projets Albums</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      /* Palette issue de la charte visuelle fournie */
      --bleu-nuit: #0B132B;
      --bleu-roi: #1D4ED8;
      --bleu-cobalt: #0047AB;
      --bleu-azur: #2589F5;
      --bleu-azur-clair: #4B9BF5;
      --violet: #7B42F6;
      --violet-vibrant: #7F00FF;
      --blanc-bleute: #F4F7FB;
      --fond-cadre: #ECEFF4;
      --sidebar-bg: #DCE6F2;
      --sidebar-active: #F7F5EE;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #5A677D;
      --vert-valide: #4E8D5E;
      --ambre-attente: #D9822B;
      --bleu-encours: #2B6CB0;
      --gris-planifie: #64748B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--blanc-bleute);
      color: var(--text-main);
    }

    .font-editorial {
      font-family: 'Fraunces', Georgia, serif;
    }

    /* Plein écran sans cadre centré */
    .app-shell {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      background: var(--blanc-bleute);
      border-radius: 0;
      box-shadow: none;
      overflow-x: hidden;
      border: none;
      display: flex;
      flex-direction: column;
    }

    /* Bandeau supérieur bleu plein écran */
    .top-header {
      width: 100%;
      background: linear-gradient(90deg, var(--bleu-cobalt) 0%, var(--bleu-roi) 52%, var(--bleu-azur) 100%);
      color: #FFFFFF;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 2px 10px rgba(0, 71, 171, 0.22);
    }

    .top-auth {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .auth-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .auth-btn:hover {
      border-color: #FFFFFF;
      background: rgba(255, 255, 255, 0.24);
    }

    .mail-icon {
      color: #FFFFFF;
      font-size: 1.05rem;
      cursor: pointer;
      opacity: 0.95;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.15;
      color: #FFFFFF;
      font-weight: 500;
    }

    /* Corps : Sidebar + Zone centrale pleine hauteur */
    .body-grid {
      flex: 1;
      width: 100%;
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      background: var(--sidebar-bg);
      padding: 18px 10px 24px;
      border-right: 1px solid #C8D5E6;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 0.92rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: #334155;
      fill: none;
      stroke-width: 1.7;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.45);
    }

    .nav-item.active {
      background: var(--sidebar-active);
      color: var(--bleu-nuit);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(11, 19, 43, 0.06);
    }

    .nav-item.active svg {
      stroke: var(--bleu-roi);
    }

    .content-pane {
      width: 100%;
      padding: 24px 32px 40px;
      background: var(--blanc-bleute);
    }

    /* En-tête de section : Titre serif + Recherche + Bouton + Nouveau Projet */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .serif-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.05rem;
      font-weight: 500;
      color: var(--bleu-nuit);
      letter-spacing: -0.01em;
    }

    .head-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      font-size: 0.88rem;
      color: var(--text-main);
      width: 225px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--bleu-roi);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      color: #64748B;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .btn-new {
      background: linear-gradient(180deg, #2B7AE8 0%, var(--bleu-cobalt) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 71, 171, 0.25);
    }

    .btn-new:hover {
      background: linear-gradient(180deg, var(--bleu-roi) 0%, #09327A 100%);
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--bleu-nuit);
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--bleu-roi);
      color: var(--bleu-roi);
    }

    /* 3 Cartes KPI avec bordure gauche épaisse et points en haut à droite */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .kpi-box {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-left-width: 5px;
      box-shadow: 0 2px 6px rgba(11, 19, 43, 0.04);
    }

    .kpi-box.k-amber { border-left-color: var(--ambre-attente); }
    .kpi-box.k-violet { border-left-color: var(--violet); }
    .kpi-box.k-blue { border-left-color: var(--bleu-roi); }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #CBD5E1;
    }

    .kpi-box.k-amber .dot:first-child { background: var(--ambre-attente); }
    .kpi-box.k-violet .dot:first-child { background: var(--violet); }
    .kpi-box.k-violet .dot:nth-child(2) { background: var(--bleu-azur); }
    .kpi-box.k-blue .dot:first-child { background: var(--bleu-nuit); }
    .kpi-box.k-blue .dot:nth-child(2) { background: var(--bleu-roi); }

    .kpi-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--bleu-nuit);
      margin: 4px 0 8px;
      line-height: 1.1;
    }

    .kpi-bar-track {
      height: 5px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      width: 100%;
    }

    .kpi-bar-fill {
      height: 100%;
      border-radius: 99px;
    }

    /* Carte tableau Suivi des projets */
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(11, 19, 43, 0.04);
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--bleu-nuit);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #EEF2F7;
      vertical-align: middle;
    }

    tbody tr.project-row {
      cursor: pointer;
      transition: background 0.14s;
    }

    tbody tr.project-row:hover {
      background: #F0F6FF;
    }

    .prog-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 135px;
    }

    .mini-track {
      width: 72px;
      height: 5px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mini-fill {
      height: 100%;
      background: var(--bleu-roi);
      border-radius: 99px;
    }

    .pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
    }

    .pill-encours { background: var(--bleu-encours); }
    .pill-attente { background: var(--ambre-attente); }
    .pill-valide  { background: var(--vert-valide); }
    .pill-planifie { background: var(--gris-planifie); }
    .pill-amont { background: var(--violet); }

    /* Vue Workflow détaillée d'un projet */
    .workflow-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    /* Bandeau horizontal des étapes du workflow (style capture) */
    .workflow-stepper {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .wf-step-card {
      background: #EEF3FA;
      color: var(--bleu-cobalt);
      border: 1px solid #D5E2F5;
      border-radius: 14px;
      padding: 14px 10px;
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.25;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    .wf-step-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(37, 137, 245, 0.16);
    }

    .wf-step-card.active-stage {
      background: linear-gradient(180deg, #3B8AF7 0%, #2575EB 100%);
      color: #FFFFFF;
      border-color: #2575EB;
      box-shadow: 0 6px 16px rgba(37, 117, 235, 0.28);
    }

    .phase-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #EEF2F7;
    }

    .phase-name {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--bleu-nuit);
    }

    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--blanc-bleute);
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .step-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
    }

    .step-left input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--bleu-roi);
      cursor: pointer;
    }

    .step-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--bleu-nuit);
    }

    .step-title.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .step-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-select {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      font-size: 0.78rem;
      font-weight: 600;
      background: #FFFFFF;
      color: var(--text-main);
      cursor: pointer;
    }

    /* 4 statuts : À faire (Gris), En cours (Jaune), Fait (Vert), En retard (Rouge) */
    .status-a-faire {
      background: #E5E7EB;
      color: #374151;
      border-color: #9CA3AF;
    }

    .status-en-cours {
      background: #FEF08A;
      color: #854D0E;
      border-color: #EAB308;
    }

    .status-fait {
      background: #DCFCE7;
      color: #166534;
      border-color: #22C55E;
    }

    .status-en-retard {
      background: #FEE2E2;
      color: #991B1B;
      border-color: #EF4444;
    }

    .step-note {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      font-size: 0.78rem;
      width: 185px;
      background: #FFFFFF;
    }

    /* Styles spécifiques de la Phase 1 éditoriale */
    .edito-tab-btn.active {
      background-color: #ffffff;
      color: var(--bleu-roi);
      border-color: var(--bleu-roi);
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.1);
    }

    .btn-edito-primary {
      background: linear-gradient(135deg, var(--bleu-roi) 0%, var(--bleu-cobalt) 100%);
      color: #ffffff;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .btn-edito-primary:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 71, 171, 0.24);
    }

    .btn-edito-violet {
      background: linear-gradient(135deg, #8F2BFF 0%, var(--violet-vibrant) 100%);
      color: #ffffff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-edito-violet:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(127, 0, 255, 0.25);
    }

    .manuscript-editor {
      line-height: 1.85;
      font-size: 0.98rem;
      font-family: 'Fraunces', Georgia, serif;
    }

    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 300;
      background: var(--bleu-nuit);
      color: #ffffff;
      border-left: 4px solid var(--bleu-azur);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(11, 19, 43, 0.25);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .toast-banner.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Modale création projet */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 19, 43, 0.52);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #FFFFFF;
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      padding: 22px 24px;
      box-shadow: 0 20px 50px rgba(11, 19, 43, 0.3);
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 14px 0 18px;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .field input, .field select, .field textarea {
      padding: 8px 10px;
      border: 1px solid #CBD5E1;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
    }

    @media (max-width: 1120px) {
      .workflow-stepper { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 900px) {
      .body-grid { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid #C8D5E6; padding: 10px; }
      .nav-item { width: auto; white-space: nowrap; }
      .content-pane { padding: 18px 16px 28px; }
      .kpi-row { grid-template-columns: 1fr; }
      .workflow-stepper { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid { grid-template-columns: 1fr; }
      .search-box input { width: 170px; }
    }
  </style>
</head>
<body>

<div id="toast" class="toast-banner" role="status" aria-live="polite"></div>

<div class="app-shell">
  <!-- Bandeau horizontal du haut bleu plein écran -->
  <header class="top-header">
    <div class="top-auth">
      <button class="auth-btn" onclick="alert('Espace éditrice — Lune et Papier Éditions')">
        <span>👤</span><span>Se connecter</span>
      </button>
      <span class="mail-icon" title="Notes & retours auteurs" onclick="app.setNav('manuscripts')">✉️</span>
    </div>

    <div class="brand-mark" onclick="app.setNav('projects')">
      <span class="brand-name">Lune et Papier<br>Éditions</span>
      <svg width="38" height="38" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M25.5 7.5A13 13 0 1 0 32.5 29a11 11 0 0 1-7-21.5Z" fill="#F8FAFC"/>
        <path d="M29 8l1.2 3.3L33.5 12.5l-3.3 1.2L29 17l-1.2-3.3-3.3-1.2 3.3-1.2L29 8Z" fill="#F8FAFC"/>
        <circle cx="34.5" cy="18.5" r="1.4" fill="#93C5FD"/>
        <circle cx="22.5" cy="6" r="1.1" fill="#E9D5FF"/>
      </svg>
    </div>
  </header>

  <div class="body-grid">
    <!-- Menu latéral gauche -->
    <aside class="sidebar" id="sidebar">
      <button class="nav-item" data-nav="dashboard" onclick="app.setNav('dashboard')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Tableau de bord</span>
      </button>

      <button class="nav-item active" data-nav="projects" onclick="app.setNav('projects')">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
        <span>Projets en cours</span>
      </button>

      <button class="nav-item" data-nav="editorial" onclick="app.setNav('editorial')">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/></svg>
        <span>Projets éditoriaux</span>
      </button>

      <button class="nav-item" data-nav="manuscripts" onclick="app.setNav('manuscripts')">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Manuscrits &amp; Auteurs</span>
      </button>

      <button class="nav-item" data-nav="production" onclick="app.setNav('production')">
        <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        <span>Production &amp; Impression</span>
      </button>

      <button class="nav-item" data-nav="catalogue" onclick="app.setNav('catalogue')">

<script>
(function() {
  const STORAGE_KEY = 'lune_papier_workflow_v4';

  const STEP_STATUSES = ['À faire', 'En cours', 'Fait', 'En retard'];

  const PHASES_TEMPLATE = [

        'Émergence de l’idée, thème & intention jeunesse',

    {

      steps: [

    {
      num: 5,

      steps: [
        'Attribution ISBN (segment AFNIL), code-barres EAN-13 & ours légal (Loi 1949 / Loi Lang)',
        'Paramétrage imprimeur / BoD & validation du BAT physique',
        'Dépôt légal BnF (déclaration & envoi exemplaire)',
        'Fiche Electre & vérification disponibilité commande sur Dilicom'
      ]
    },
    {
      num: 6,
      bannerLabel: 'Lancement,<br>Diffusion &amp;<br>Commercialisa-<br>tion',
      title: 'Phase 5 — Lancement, Diffusion & Commercialisation',
      steps: [
        'Fiche produit boutique, fiche argumentaire libraire & Cover Reveal',
        'Précommandes & envoi des Services de Presse (SP)',
        'Ventes directes, salons, librairies indépendantes & Cultura/Fnac'
      ]
    }
  ];

  const WORKFLOW_STATES = [
    'En lecture',
    'Note envoyée',
    'En attente retour auteur',
    'Réécriture reçue',
    'Validé'
  ];

  const COPY_CHECKLIST_ITEMS = [
    {
      id: 'vocab',
      label: 'Richesse du vocabulaire & précision des mots (refus de la simplification à outrance)',
      detail: 'Les verbes d’action, adjectifs et images poétiques nourrissent la curiosité des jeunes lecteurs.'
    },
    {
      id: 'rhythm',
      label: 'Rythme & musicalité à la lecture à voix haute (parent / enfant)',
      detail: 'Les phrases respirent, les dialogues sonnent naturel et les chutes de page créent de l’élan.'
    },
    {
      id: 'repetitions',
      label: 'Tri des répétitions involontaires vs répétitions poétiques voulues',
      detail: 'Les mots parasites ou tics de langage sont remplacés par des formulations plus justes.'
    },
    {
      id: 'punctuation',
      label: 'Ponctuation, majuscules & espaces ortho-typographiques français',
      detail: 'Virgules, points d’exclamation/interrogation, tirets de dialogue et guillemets harmonisés.'
    },
    {
      id: 'consistency',
      label: 'Cohérence interne : prénoms, âges, objets, chronologie & décors',
      detail: 'Aucune contradiction entre le début, le milieu et le dénouement de l’histoire.'
    },
    {
      id: 'visual_beats',
      label: 'Potentiel de découpage visuel scène par scène / double-page',
      detail: 'Chaque temps fort offre un ancrage clair pour le futur storyboard et la mise en scène.'
    }
  ];

  const GATE_CRITERIA = [
    {
      id: 'readAloudDone',
      title: 'Lecture à voix haute effectuée & rythme validé',
      description: 'Le texte a été lu à haute voix pour vérifier sa fluidité orale, ses coupes et sa musicalité.'
    },
    {
      id: 'editorialNoteDone',
      title: 'Note éditoriale rédigée & partagée (méthode sandwich bienveillant)',
      description: 'Points forts, axes de structure/rythme/personnages/potentiel visuel et projection sont posés.'
    },
    {
      id: 'versionValidated',
      title: 'Version narrative (V2 / V3) validée avec l’auteur',
      description: 'L’arc narratif, le rôle des personnages et la fin sont stabilisés d’un commun accord.'
    },
    {
      id: 'copyPrepDone',
      title: 'Préparation de copie & contrôle ortho-typographique achevés',
      description: 'Vocabulaire, ponctuation, cohérence des décors et découpage potentiel ont été vérifiés.'
    }
  ];

  function normalizeStepState(state) {
    if (STEP_STATUSES.includes(state)) return state;
    if (state === 'Terminé') return 'Fait';
    if (state === 'En attente de validation') return 'En cours';
    if (state === 'Bloqué') return 'En retard';
    return 'À faire';
  }

  function stepStatusClass(state) {
    const norm = normalizeStepState(state);
    if (norm === 'Fait') return 'status-fait';
    if (norm === 'En cours') return 'status-en-cours';
    if (norm === 'En retard') return 'status-en-retard';
    return 'status-a-faire';
  }

  function buildSteps(completedCount) {
    const all = [];
    PHASES_TEMPLATE.forEach(ph => {
      ph.steps.forEach((label, idx) => {
        const globalIdx = all.length;
        const isDone = globalIdx < completedCount;
        all.push({
          id: 'st_' + ph.num + '_' + idx + '_' + Math.random().toString(36).slice(2, 6),
          phaseNum: ph.num,
          phaseTitle: ph.title,
          label,
          state: isDone ? 'Fait' : (globalIdx === completedCount ? 'En cours' : 'À faire'),
          note: ''
        });
      });
    });
    return all;
  }

  function buildEditorialDataForProject(proj) {
    const isLilou = proj.id === 'p_lilou';
    const isMurphy = proj.id === 'p_murphy';
    return {
      ageGroup: '4–8 ans',
      origin: proj.type || 'Album maison',
      targetSeason: proj.deadline || 'Printemps',
      workflowStatus: isLilou ? 'Réécriture reçue' : (isMurphy ? 'Note envoyée' : 'En lecture'),
      activeVersion: isLilou ? 'V2' : 'V1',
      versions: {
        V1: isLilou
          ? `Au cœur du verger baigné d'une lumière opale, Lilou le petit lapin blanc s'étira longuement. Aujourd'hui n'était pas un matin ordinaire : le grand panier d'osier tressé attendait près de la haie d'aubépine.\n\nLilou bondit par-dessus les flaques de rosée et frappa trois petits coups contre l'écorce du vieux pommier. « Hé ho, Barnabé ! Tu dors encore ? » demanda Lilou d'une voix claire.\n\nBarnabé le hérisson fit rouler son museau piquant hors des feuilles sèches. Ensemble, ils partirent explorer le sentier secret où les œufs nacrés se cachaient sous les fougères, les mousses et les racines tortueuses.`
          : `Projet : ${proj.title}\nAuteur : ${proj.author}\n\nPremier jet du texte en cours d'écriture et d'édition pour Lune et Papier Éditions.`,
        V2: isLilou
          ? `Au cœur du verger baigné d'une lumière opale, Lilou le jeune lapin blanc s'étira longuement. Ce matin-là, l'air sentait la sève fraîche et les bourgeons naissants : le grand panier d'osier tressé attendait près de la haie d'aubépine.\n\nLilou bondit par-dessus les flaques de rosée et frappa trois coups légers contre l'écorce rugueuse du vieux pommier. « Allons, Barnabé ! Le soleil a déjà doré les collines ! » s'exclama Lilou.\n\nBarnabé le hérisson défit sa boule piquante et huma l'air vif. Ensemble, ils s'engagèrent sur le sentier secret où les œufs nacrés se dissimulaient sous les fougères, les coussins de mousse et les racines noueuses.`
          : '',
        V3: ''
      },
      note: {
        strengths: isLilou
          ? 'Une atmosphère printanière très sensible, un duo Lilou / Barnabé attachant et une belle musicalité dès les premières lignes.'
          : 'Un univers attachant et un beau potentiel d’album jeunesse à voix haute.',
        axes: isLilou
          ? '• Structure & rythme : resserrer l’entrée en matière pour arriver plus vite au premier rebondissement.\n• Personnages : nuancer la malice de Barnabé face à l’enthousiasme de Lilou.\n• Potentiel visuel : ménager des respirations pour la double-page du verger et du sentier secret.'
          : '• Structure & rythme : vérifier l’élan narratif et les chutes de page.\n• Personnages : affiner les dialogues et intentions.\n• Potentiel visuel : repérer les doubles-pages clés.',
        projection: isLilou
          ? 'La V2 gagne déjà en relief et en précision de vocabulaire. Une dernière passe d’affinage sur les transitions permettra de verrouiller le texte pour le storyboard.'
          : 'Poursuivre l’affinage du texte et préparer la note éditoriale détaillée.'
      },
      exchanges: [
        {
          id: 'ex_' + proj.id + '_1',
          date: '12/11/2026',
          channel: 'Lecture à voix haute',
          summary: 'Test oral du manuscrit : vérification de la musicalité et du rythme de lecture.'
        },
        {
          id: 'ex_' + proj.id + '_2',
          date: '15/11/2026',
          channel: 'Note éditoriale',
          summary: 'Partage de la note structurée (structure, rythme, potentiel visuel).'
        },
        {
          id: 'ex_' + proj.id + '_3',
          date: '19/11/2026',
          channel: 'Mail / Manuscrit',
          summary: 'Suivi de la version en cours et des ajustements éditoriaux.'
        }
      ],
      copyNotes: 'Vérifier la ponctuation, les accords et la cohérence des décors avant le verrouillage pour le storyboard.',
      copyChecklist: {
        vocab: true,
        rhythm: true,
        repetitions: false,
        punctuation: false,
        consistency: true,
        visual_beats: true
      },
      gates: {
        readAloudDone: true,
        editorialNoteDone: true,
        versionValidated: false,
        copyPrepDone: false
      },
      lockedForStoryboard: false,
      lockedAt: null,
      studioHandoverNote: 'Texte soigné à la lecture à voix haute ; prévoir des décors riches et une mise en scène fluide.'
    };
  }

  function defaultData() {
    const baseProjects = [
      {
        id: 'p_lilou',
        title: 'Les aventures de Lilou le lapin de Pâques',
        author: 'Anne-Sophie Guerout',
        type: 'Album maison',
        phaseLabel: 'Maquette',
        deadline: '15 Mars 2027',
        technique: 'Aquarelle',
        status: 'En cours',
        steps: buildSteps(14)
      },
      {
        id: 'p_murphy',
        title: 'Murphy & Aglaé : Soif de héros',
        author: 'Paméla Ivanes',
        type: 'Auteur partenaire',
        phaseLabel: 'Storyboard',
        deadline: '20 Avr 2027',
        technique: 'Numérique',
        status: 'En attente',
        steps: buildSteps(9)
      },
      {
        id: 'p_noel',
        title: 'Une maison pour Noël',
        author: 'Anne-Sophie Guerout',
        type: 'Album maison',
        phaseLabel: 'Correction',
        deadline: '15 Oct 2027',
        technique: 'Aquarelle',
        status: 'BAT Validé',
        steps: buildSteps(19)
      },
      {
        id: 'p_foret',
        title: 'Le secret des feuilles d’automne',
        author: 'À définir',
        type: 'Album maison',
        phaseLabel: 'Idée / Amont',
        deadline: '01 Sept 2027',
        technique: 'Aquarelle',
        status: 'Planifié',
        steps: buildSteps(1)
      }
    ].map(p => ({ ...p, editorial: buildEditorialDataForProject(p) }));

    return {
      nav: 'projects',
      search: '',
      selectedProjectId: null,
      activeWorkflowPhase: 0,
      editoTab: 'atelier',
      voiceReadingActive: false,
      voiceReadingIndex: 0,
      projects: baseProjects
    };
  }

  let voiceTimer = null;

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      const parsed = { ...defaultData(), ...JSON.parse(raw) };
      parsed.voiceReadingActive = false;
      parsed.voiceReadingIndex = 0;
      parsed.projects = (parsed.projects || []).map(p => ({
        ...p,
        steps: (p.steps || []).map(s => ({ ...s, state: normalizeStepState(s.state) })),
        editorial: p.editorial ? { ...buildEditorialDataForProject(p), ...p.editorial } : buildEditorialDataForProject(p)
      }));
      return parsed;
    } catch {
      return defaultData();
    }
  }

  let db = loadData();

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      nav: db.nav,
      search: db.search,
      selectedProjectId: db.selectedProjectId,
      activeWorkflowPhase: db.activeWorkflowPhase,
      editoTab: db.editoTab,
      projects: db.projects
    }));
  }

  function showToast(message) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => {
      el.classList.remove('show');
    }, 2600);
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function calcProgress(project) {
    if (!project.steps || !project.steps.length) return 0;
    const done = project.steps.filter(s => normalizeStepState(s.state) === 'Fait').length;
    return Math.round((done / project.steps.length) * 100);
  }

  function statusPill(status) {
    const map = {
      'En cours': 'pill-encours',
      'En attente': 'pill-attente',
      'BAT Validé': 'pill-valide',
      'Terminé': 'pill-valide',
      'Planifié': 'pill-planifie',
      'Idée / Amont': 'pill-amont'
    };
    const cls = map[status] || 'pill-encours';
    return `<span class="pill ${cls}">${esc(status)}</span>`;
  }

  function getCurrentWorkflowProject() {
    return db.projects.find(p => p.id === db.selectedProjectId) || db.projects[0];
  }

  function getActiveManuscriptText(ed) {
    const v = ed.activeVersion || 'V1';
    return (ed.versions && ed.versions[v]) || '';
  }

  function computeEditoProgress(ed) {
    const gateKeys = GATE_CRITERIA.map(g => g.id);
    const gatesDone = gateKeys.filter(k => Boolean(ed.gates && ed.gates[k])).length;

    const copyKeys = COPY_CHECKLIST_ITEMS.map(c => c.id);
    const copyDone = copyKeys.filter(k => Boolean(ed.copyChecklist && ed.copyChecklist[k])).length;

    const hasNote = Boolean(
      ed.note &&
      (ed.note.strengths.trim() || ed.note.axes.trim() || ed.note.projection.trim())
    );
    const hasV2OrV3 = Boolean(
      (ed.versions && ed.versions.V2 && ed.versions.V2.trim()) ||
      (ed.versions && ed.versions.V3 && ed.versions.V3.trim())
    );

    const gatePct = (gatesDone / gateKeys.length) * 55;
    const copyPct = (copyDone / copyKeys.length) * 25;
    const notePct = hasNote ? 10 : 0;
    const verPct = hasV2OrV3 ? 10 : 0;

    if (ed.lockedForStoryboard) return 100;
    return Math.min(99, Math.round(gatePct + copyPct + notePct + verPct));
  }

  function analyzeText(text) {
    const trimmed = (text || '').trim();
    if (!trimmed) {
      return {
        words: 0,
        sentences: 0,
        readingSecondsLabel: '0 s',
        repeatedWords: [],
        sentencesList: []
      };
    }

    const wordsArr = trimmed.match(/[A-Za-zÀ-ÖØ-öø-ÿ’'-]+/g) || [];
    const words = wordsArr.length;
    const totalSeconds = Math.max(10, Math.round((words / 115) * 60));
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    const readingSecondsLabel = mins > 0 ? `${mins} min ${secs > 0 ? secs + ' s' : ''}`.trim() : `${secs} s`;

    const sentencesList = trimmed
      .split(/(?<=[.!?…»])\s+/)
      .map(s => s.trim())
      .filter(Boolean);

    const stopWords = new Set([
      'avec', 'dans', 'pour', 'mais', 'comme', 'alors', 'ainsi', 'encore', 'vers',
      'entre', 'après', 'avant', 'sous', 'sur', 'tout', 'toute', 'tous', 'toutes',
      'plus', 'moins', 'très', 'bien', 'petit', 'petite', 'était', 'étaient',
      'avaient', 'avait', 'leurs', 'leur', 'celui', 'celle', 'ceux', 'celles'
    ]);

    const freq = {};
    wordsArr.forEach(raw => {
      const clean = raw.toLowerCase().replace(/^[^a-zà-öø-ÿ]+|[^a-zà-öø-ÿ]+$/g, '');
      if (clean.length >= 5 && !stopWords.has(clean)) {
        freq[clean] = (freq[clean] || 0) + 1;
      }
    });

    const repeatedWords = Object.entries(freq)
      .filter(([, count]) => count >= 2)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([word, count]) => ({ word, count }));

    return {
      words,
      sentences: sentencesList.length,
      readingSecondsLabel,
      repeatedWords,
      sentencesList
    };
  }

        <div class="panel-title">
          <span>Suivi des projets</span>
          <span style="font-size:0.8rem; color:var(--text-muted); font-weight:400;">Cliquez sur un projet pour ouvrir son workflow complet (de la Phase 0 amont à Dilicom/Electre)</span>

                return `

  function renderWorkflowView() {
    const project = getCurrentWorkflowProject();
    if (!project) return renderProjectsDashboard();

    const pct = calcProgress(project);
    const activeStage = typeof db.activeWorkflowPhase === 'number' ? db.activeWorkflowPhase : 0;
    const currentPhase = PHASES_TEMPLATE.find(ph => ph.num === activeStage) || PHASES_TEMPLATE[0];
    const phaseSteps = project.steps.filter(s => s.phaseNum === currentPhase.num);
    const phDone = phaseSteps.filter(s => normalizeStepState(s.state) === 'Fait').length;

    return `
      <div class="workflow-top">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <button class="btn-secondary" onclick="app.backToProjects()">← Retour aux projets</button>
          <div>
            <h1 class="serif-title" style="font-size:1.65rem;">${esc(project.title)}</h1>
            <div style="font-size:0.84rem; color:var(--text-muted);">
              ${esc(project.author)} • ${esc(project.type)} • Technique : ${esc(project.technique)} • Échéance : ${esc(project.deadline || 'À définir')}
            </div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <select class="step-select" style="padding:7px 10px; font-weight:600;" onchange="app.changeProjectStatus('${project.id}', this.value)">
            ${['Idée / Amont','Planifié','En cours','En attente','BAT Validé','Terminé'].map(st =>
              `<option value="${st}" ${project.status === st ? 'selected' : ''}>Statut : ${st}</option>`
            ).join('')}
          </select>
          <span class="pill pill-encours" style="background:var(--bleu-roi); font-size:0.86rem;">${pct}% complété</span>
        </div>
      </div>

      <!-- Bandeau horizontal des étapes du workflow -->
      <div class="workflow-stepper" role="tablist" aria-label="Étapes du workflow">
        ${PHASES_TEMPLATE.map(ph => {
          const isActive = ph.num === currentPhase.num;
          return `
            <button
              type="button"
              class="wf-step-card ${isActive ? 'active-stage' : ''}"
              onclick="app.selectWorkflowPhase(${ph.num})"
            >
              <span>${ph.bannerLabel}</span>
            </button>
          `;
        }).join('')}
      </div>

      <div class="panel-card" style="padding:14px 18px; margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; font-size:0.84rem; margin-bottom:6px;">
          <span><strong>Avancement global du workflow (Amont &amp; Idéation → Lancement, Diffusion &amp; Commercialisation)</strong></span>
          <span>${project.steps.filter(s => normalizeStepState(s.state) === 'Fait').length} / ${project.steps.length} étapes terminées</span>
        </div>
        <div class="kpi-bar-track" style="height:8px;">
          <div class="kpi-bar-fill" style="width:${pct}%; background:linear-gradient(90deg, var(--violet), var(--bleu-roi));"></div>
        </div>
      </div>

      <!-- Uniquement la to-do de la phase du workflow concernée -->
      <div class="phase-card" id="phase-block-${currentPhase.num}" style="border-color:#2575EB; box-shadow:0 4px 14px rgba(37,117,235,0.12);">
        <div class="phase-header">
          <span class="phase-name">${esc(currentPhase.title)}</span>
          <span style="font-size:0.8rem; font-weight:600; color:var(--bleu-cobalt);">${phDone}/${phaseSteps.length} validées</span>
        </div>
        ${phaseSteps.map(st => {
          const stNorm = normalizeStepState(st.state);
          const isDone = stNorm === 'Fait';
          return `
            <div class="step-item">
              <div class="step-left">
                <input type="checkbox" ${isDone ? 'checked' : ''} onchange="app.toggleStep('${project.id}', '${st.id}')" />
                <span class="step-title ${isDone ? 'done' : ''}">${esc(st.label)}</span>
              </div>
              <div class="step-controls">
                <select class="step-select ${stepStatusClass(stNorm)}" onchange="app.setStepState('${project.id}', '${st.id}', this.value)">
                  ${STEP_STATUSES.map(opt =>
                    `<option value="${opt}" ${stNorm === opt ? 'selected' : ''}>${opt}</option>`
                  ).join('')}
                </select>
                <input class="step-note" type="text" placeholder="Note / date..." value="${esc(st.note)}" onchange="app.setStepNote('${project.id}', '${st.id}', this.value)" />
              </div>
            </div>
          `;
        }).join('')}

        ${currentPhase.num === 1 ? renderPhase1EditorialWorkspace(project) : ''}
      </div>
    `;
  }

  function renderSecondarySection() {
    const labels = {
      dashboard: 'Tableau de bord',
      editorial: 'Projets éditoriaux',
      manuscripts: 'Manuscrits & Auteurs',
      production: 'Production & Impression (BnF / Dilicom / Electre)',
      catalogue: 'Catalogue Lune & Papier',
      distribution: 'Ventes & Distribution',

      settings: 'Paramètres'
    };

    return `
      <div class="section-head">

      </div>
      <div class="panel-card">
        <div class="panel-title">Accès rapide aux projets liés</div>
        <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:14px;">
          Retrouvez l’ensemble de vos albums actifs et cliquez sur n’importe lequel pour piloter ses étapes éditoriales, artistiques, contrats, BnF et Dilicom/Electre.
        </p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          ${db.projects.map(p => `
            <button class="btn-secondary" onclick="app.openWorkflow('${p.id}')">

  function render() {
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.nav === db.nav);
    });
    const main = document.getElementById('main-content');
    if (db.nav === 'workflow') {
      main.innerHTML = renderWorkflowView();
    } else if (db.nav === 'projects') {
      main.innerHTML = renderProjectsDashboard();
    } else {
      main.innerHTML = renderSecondarySection();
    }
  }

  window.app = {
    setNav(nav) {
      db.nav = nav;
      save();
      render();
    },
    onSearch(val) {
      db.search = val;
      save();
      render();
    },
    openModal() {
      document.getElementById('modal-new-project').classList.add('open');
    },
    closeModal() {
      document.getElementById('modal-new-project').classList.remove('open');
    },
    createProject(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const startPhase = parseInt(fd.get('startPhase') || '0', 10);
      const steps = buildSteps(0);
      steps.forEach(s => {
        if (s.phaseNum < startPhase) s.state = 'Fait';
      });
      const firstActive = steps.find(s => s.state !== 'Fait');
      if (firstActive) firstActive.state = 'En cours';

      const phaseNames = ['Idée / Amont', 'Édition', 'Storyboard', 'Contrats', 'Maquette', 'BnF / Dilicom', 'Lancement'];
      const newProj = {
        id: 'p_' + Date.now(),
        title: (fd.get('title') || '').trim(),
        author: (fd.get('author') || '').trim() || 'À définir',
        type: fd.get('type'),
        phaseLabel: phaseNames[startPhase] || 'Idée / Amont',
        deadline: (fd.get('deadline') || '').trim(),
        technique: fd.get('technique'),
        status: fd.get('status'),
        steps
      };
      newProj.editorial = buildEditorialDataForProject(newProj);
      db.projects.unshift(newProj);
      db.selectedProjectId = newProj.id;
      db.activeWorkflowPhase = startPhase;
      db.nav = 'workflow';
      save();
      e.target.reset();
      this.closeModal();
      render();
    },
    openWorkflow(id) {
      db.selectedProjectId = id;
      db.activeWorkflowPhase = 0;
      db.voiceReadingActive = false;
      db.voiceReadingIndex = 0;
      clearInterval(voiceTimer);
      db.nav = 'workflow';
      save();
      render();
    },
    selectWorkflowPhase(phaseNum) {
      db.activeWorkflowPhase = phaseNum;
      db.voiceReadingActive = false;
      db.voiceReadingIndex = 0;
      clearInterval(voiceTimer);
      save();
      render();
      const el = document.getElementById('phase-block-' + phaseNum);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    },
    backToProjects() {
      db.voiceReadingActive = false;
      clearInterval(voiceTimer);
      db.nav = 'projects';
      save();
      render();
    },
    changeProjectStatus(id, status) {
      const p = db.projects.find(x => x.id === id);
      if (p) { p.status = status; save(); render(); }
    },
    toggleStep(projId, stepId) {
      const p = db.projects.find(x => x.id === projId);
      const s = p && p.steps.find(x => x.id === stepId);
      if (!s) return;
      s.state = (normalizeStepState(s.state) === 'Fait') ? 'À faire' : 'Fait';
      save();
      render();
    },
    setStepState(projId, stepId, stateVal) {
      const p = db.projects.find(x => x.id === projId);
      const s = p && p.steps.find(x => x.id === stepId);
      if (s) { s.state = normalizeStepState(stateVal); save(); render(); }
    },
    setStepNote(projId, stepId, noteVal) {
      const p = db.projects.find(x => x.id === projId);
      const s = p && p.steps.find(x => x.id === stepId);
      if (s) { s.note = noteVal; save(); }
    },

    /* Actions Phase 1 : Écriture, Édition & Préparation du Texte */
    setEditoTab(tabName) {
      db.editoTab = tabName;
      save();
      render();
    },
    updateManuscriptText(value) {
      const p = getCurrentWorkflowProject();
      const ed = p.editorial;
      const ver = ed.activeVersion || 'V1';
      ed.versions[ver] = value;
      save();
    },
    toggleVoiceReadingSim() {
      const p = getCurrentWorkflowProject();
      const stats = analyzeText(getActiveManuscriptText(p.editorial));
      if (!stats.sentencesList.length) {
        showToast('Ajoutez d’abord un texte à lire à voix haute.');
        return;
      }

      db.voiceReadingActive = !db.voiceReadingActive;
      db.voiceReadingIndex = 0;
      clearInterval(voiceTimer);

      if (db.voiceReadingActive) {
        voiceTimer = setInterval(() => {
          const currentStats = analyzeText(getActiveManuscriptText(getCurrentWorkflowProject().editorial));
          if (!currentStats.sentencesList.length) return;
          db.voiceReadingIndex = (db.voiceReadingIndex + 1) % currentStats.sentencesList.length;
          render();
        }, 3400);
        showToast('Guide de lecture à voix haute activé (1 phrase ~3,4 s).');
      } else {
        showToast('Guide de lecture à voix haute arrêté.');
      }
      render();
    },
    stepVoicePhrase(delta) {
      const stats = analyzeText(getActiveManuscriptText(getCurrentWorkflowProject().editorial));
      if (!stats.sentencesList.length) return;
      const total = stats.sentencesList.length;
      db.voiceReadingIndex = (db.voiceReadingIndex + delta + total) % total;
      render();
    },
    markReadAloudValidated() {
      const p = getCurrentWorkflowProject();
      p.editorial.gates.readAloudDone = true;
      save();
      render();
      showToast('Lecture à voix haute marquée comme validée.');
    },
    updateNoteField(field, value) {
      const ed = getCurrentWorkflowProject().editorial;
      ed.note[field] = value;
      if (ed.note.strengths.trim() && ed.note.axes.trim()) {
        ed.gates.editorialNoteDone = true;
      }
      save();
    },
    highlightWordInNote(word) {
      const ed = getCurrentWorkflowProject().editorial;
      const addition = `Répétition repérée : « ${word} » — vérifier si elle est voulue ou à varier.`;
      if (!ed.note.axes.includes(word)) {
        ed.note.axes = ed.note.axes.trim()
          ? `${ed.note.axes.trim()}\n• ${addition}`
          : `• ${addition}`;
        save();
        render();
        showToast(`Repère « ${word} » ajouté aux axes de la note éditoriale.`);
      }
    },
    copyEditorialNote() {
      const p = getCurrentWorkflowProject();
      const ed = p.editorial;
      const formatted = [
        `NOTE ÉDITORIALE — ${p.title}`,
        `Auteur : ${p.author} | Version : ${ed.activeVersion || 'V1'}`,
        '',
        '1. POINTS FORTS',
        ed.note.strengths.trim() || '(À compléter)',
        '',
        '2. AXES DE TRAVAIL (STRUCTURE, RYTHME, PERSONNAGES, POTENTIEL VISUEL)',
        ed.note.axes.trim() || '(À compléter)',
        '',
        '3. PROJECTION',
        ed.note.projection.trim() || '(À compléter)'
      ].join('\n');

      this.copyToClipboard(formatted, 'Note éditoriale copiée dans le presse-papiers.');
    },
    switchVersion(ver) {
      getCurrentWorkflowProject().editorial.activeVersion = ver;
      save();
      render();
    },
    updateSpecificVersion(ver, value) {
      const ed = getCurrentWorkflowProject().editorial;
      ed.versions[ver] = value;
      if ((ver === 'V2' || ver === 'V3') && value.trim().length > 20) {
        ed.gates.versionValidated = true;
      }
      save();
    },
    duplicateVersionToNext() {
      const ed = getCurrentWorkflowProject().editorial;
      const order = ['V1', 'V2', 'V3'];
      const currentIdx = order.indexOf(ed.activeVersion || 'V1');
      if (currentIdx === -1 || currentIdx >= order.length - 1) {
        showToast('La version V3 est déjà la dernière version disponible.');
        return;
      }
      const nextVer = order[currentIdx + 1];
      ed.versions[nextVer] = ed.versions[order[currentIdx]] || '';
      ed.activeVersion = nextVer;
      ed.workflowStatus = 'Réécriture reçue';
      save();
      render();
      showToast(`Texte dupliqué vers ${nextVer}.`);
    },
    updateWorkflowStatus(newStatus) {
      const ed = getCurrentWorkflowProject().editorial;
      ed.workflowStatus = newStatus;
      if (newStatus === 'Validé') {
        ed.gates.versionValidated = true;
      }
      save();
      render();
      showToast(`Statut mis à jour : ${newStatus}.`);
    },
    addExchange(event) {
      event.preventDefault();
      const form = event.target;
      const fd = new FormData(form);
      const summary = (fd.get('summary') || '').trim();
      if (!summary) return;

      const ed = getCurrentWorkflowProject().editorial;
      ed.exchanges.unshift({
        id: 'ex_' + Date.now(),
        date: (fd.get('date') || '').trim(),
        channel: fd.get('channel') || 'Mail / Manuscrit',
        summary
      });
      save();
      form.reset();
      render();
      showToast('Échange ajouté au journal.');
    },
    deleteExchange(exchangeId) {
      const ed = getCurrentWorkflowProject().editorial;
      ed.exchanges = (ed.exchanges || []).filter(e => e.id !== exchangeId);
      save();
      render();
    },
    toggleCopyItem(itemId) {
      const ed = getCurrentWorkflowProject().editorial;
      ed.copyChecklist[itemId] = !Boolean(ed.copyChecklist[itemId]);
      save();
      render();
    },
    updateCopyNotes(value) {
      getCurrentWorkflowProject().editorial.copyNotes = value;
      save();
    },
    completeCopyGate() {
      getCurrentWorkflowProject().editorial.gates.copyPrepDone = true;
      save();
      render();
      showToast('Préparation de copie validée dans les critères de verrouillage.');
    },
    toggleGate(gateId) {
      const ed = getCurrentWorkflowProject().editorial;
      ed.gates[gateId] = !Boolean(ed.gates[gateId]);
      save();
      render();
    },
    updateStudioHandover(value) {
      getCurrentWorkflowProject().editorial.studioHandoverNote = value;
      save();
    },
    toggleStoryboardLock() {
      const ed = getCurrentWorkflowProject().editorial;
      ed.lockedForStoryboard = !ed.lockedForStoryboard;
      if (ed.lockedForStoryboard) {
        ed.lockedAt = new Date().toLocaleDateString('fr-FR');
        ed.workflowStatus = 'Validé';
        ed.gates.readAloudDone = true;
        ed.gates.editorialNoteDone = true;
        ed.gates.versionValidated = true;
        ed.gates.copyPrepDone = true;
        showToast('Texte verrouillé « Bon pour storyboard » !');
      } else {
        ed.lockedAt = null;
        showToast('Verrouillage levé : le texte repasse en édition.');
      }
      save();
      render();
    },
    copyHandoverSummary() {
      const p = getCurrentWorkflowProject();
      const ed = p.editorial;
      const summary = [
        `BASCULE STUDIO (BON POUR STORYBOARD) — ${p.title}`,
        `Auteur : ${p.author} | Tranche d’âge : ${ed.ageGroup}`,
        `Version verrouillée : ${ed.activeVersion || 'V1'} | Statut : ${
          ed.lockedForStoryboard ? 'VERROUILLÉ (' + (ed.lockedAt || '') + ')' : ed.workflowStatus
        }`,
        `Notes Studio : ${ed.studioHandoverNote.trim() || '(Aucune note transmise)'}`
      ].join('\n');

      this.copyToClipboard(summary, 'Récapitulatif pour le Studio copié.');
    },
    copyToClipboard(text, successMsg) {
      try {
        const helper = document.createElement('textarea');
        helper.value = text;
        helper.setAttribute('readonly', '');
        helper.style.position = 'absolute';
        helper.style.left = '-9999px';
        document.body.appendChild(helper);
        helper.select();
        document.execCommand('copy');
        document.body.removeChild(helper);
        showToast(successMsg);
      } catch (err) {
        console.error('Copie impossible :', err);
        showToast('Impossible de copier automatiquement.');
      }
    }
  };

  render();
})();
</script>
</body>
</html>
