<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lune et Papier Éditions — Suivi des Projets Albums</title>
  <style>
    :root {
      /* Palette issue de la charte visuelle fournie */
      --bleu-nuit: #0B132B;
      --bleu-roi: #1D4ED8;
      --bleu-cobalt: #0047AB;
      --bleu-azur: #2589F5;
      --bleu-azur-clair: #4B9BF5;
      --violet: #7B42F6;
      --blanc-bleute: #F4F7FB;
      --fond-cadre: #ECEFF4;
      --sidebar-bg: #DCE6F2;
      --sidebar-active: #F7F5EE;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #5A677D;
      --vert-valide: #4E8D5E;
      --ambre-attente: #D9822B;
      --bleu-encours: #2B6CB0;
      --gris-planifie: #64748B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--fond-cadre);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
    }

    /* Fenêtre principale façon maquette */
    .app-shell {
      max-width: 1360px;
      margin: 0 auto;
      background: var(--blanc-bleute);
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(11, 19, 43, 0.14);
      overflow: hidden;
      border: 1px solid #CBD5E1;
    }

    /* Barre supérieure */
    .top-header {
      background: var(--bleu-nuit);
      color: #FFFFFF;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .top-auth {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .auth-btn {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .auth-btn:hover {
      border-color: var(--bleu-azur-clair);
      background: rgba(255, 255, 255, 0.06);
    }

    .mail-icon {
      color: #FFFFFF;
      font-size: 1.05rem;
      cursor: pointer;
      opacity: 0.9;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.15;
      color: #FFFFFF;
      font-weight: 500;
    }

    /* Corps : Sidebar + Zone centrale */
    .body-grid {
      display: grid;
      grid-template-columns: 235px 1fr;
      min-height: 690px;
    }

    .sidebar {
      background: var(--sidebar-bg);
      padding: 18px 10px 24px;
      border-right: 1px solid #C8D5E6;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 0.92rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: #334155;
      fill: none;
      stroke-width: 1.7;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.45);
    }

    .nav-item.active {
      background: var(--sidebar-active);
      color: var(--bleu-nuit);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(11, 19, 43, 0.06);
    }

    .nav-item.active svg {
      stroke: var(--bleu-roi);
    }

    .content-pane {
      padding: 24px 28px 36px;
      background: var(--blanc-bleute);
    }

    /* En-tête de section : Titre serif + Recherche + Bouton + Nouveau Projet */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .serif-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.05rem;
      font-weight: 500;
      color: var(--bleu-nuit);
      letter-spacing: -0.01em;
    }

    .head-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      font-size: 0.88rem;
      color: var(--text-main);
      width: 225px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--bleu-roi);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      color: #64748B;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .btn-new {
      background: linear-gradient(180deg, #2B7AE8 0%, var(--bleu-cobalt) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 71, 171, 0.25);
    }

    .btn-new:hover {
      background: linear-gradient(180deg, var(--bleu-roi) 0%, #09327A 100%);
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--bleu-nuit);
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--bleu-roi);
      color: var(--bleu-roi);
    }

    /* 3 Cartes KPI avec bordure gauche épaisse et points en haut à droite */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .kpi-box {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-left-width: 5px;
      box-shadow: 0 2px 6px rgba(11, 19, 43, 0.04);
    }

    .kpi-box.k-amber { border-left-color: var(--ambre-attente); }
    .kpi-box.k-violet { border-left-color: var(--violet); }
    .kpi-box.k-blue { border-left-color: var(--bleu-roi); }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #CBD5E1;
    }

    .kpi-box.k-amber .dot:first-child { background: var(--ambre-attente); }
    .kpi-box.k-violet .dot:first-child { background: var(--violet); }
    .kpi-box.k-violet .dot:nth-child(2) { background: var(--bleu-azur); }
    .kpi-box.k-blue .dot:first-child { background: var(--bleu-nuit); }
    .kpi-box.k-blue .dot:nth-child(2) { background: var(--bleu-roi); }

    .kpi-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--bleu-nuit);
      margin: 4px 0 8px;
      line-height: 1.1;
    }

    .kpi-bar-track {
      height: 5px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      width: 100%;
    }

    .kpi-bar-fill {
      height: 100%;
      border-radius: 99px;
    }

    /* Carte tableau Suivi des projets */
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(11, 19, 43, 0.04);
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--bleu-nuit);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #EEF2F7;
      vertical-align: middle;
    }

    tbody tr.project-row {
      cursor: pointer;
      transition: background 0.14s;
    }

    tbody tr.project-row:hover {
      background: #F0F6FF;
    }

    .prog-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 135px;
    }

    .mini-track {
      width: 72px;
      height: 5px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mini-fill {
      height: 100%;
      background: var(--bleu-roi);
      border-radius: 99px;
    }

    .pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
    }

    .pill-encours { background: var(--bleu-encours); }
    .pill-attente { background: var(--ambre-attente); }
    .pill-valide  { background: var(--vert-valide); }
    .pill-planifie { background: var(--gris-planifie); }
    .pill-amont { background: var(--violet); }

    /* Vue Workflow détaillée d'un projet */
    .workflow-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .phase-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #EEF2F7;
    }

    .phase-name {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--bleu-nuit);
    }

    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--blanc-bleute);
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .step-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
    }

    .step-left input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--bleu-roi);
      cursor: pointer;
    }

    .step-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--bleu-nuit);
    }

    .step-title.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .step-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      font-size: 0.78rem;
      background: #FFFFFF;
      color: var(--text-main);
    }

    .step-note {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      font-size: 0.78rem;
      width: 185px;
      background: #FFFFFF;
    }

    /* Modale création projet */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 19, 43, 0.52);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #FFFFFF;
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      padding: 22px 24px;
      box-shadow: 0 20px 50px rgba(11, 19, 43, 0.3);
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 14px 0 18px;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .field input, .field select, .field textarea {
      padding: 8px 10px;
      border: 1px solid #CBD5E1;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
    }

    @media (max-width: 900px) {
      .body-grid { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid #C8D5E6; padding: 10px; }
      .nav-item { width: auto; white-space: nowrap; }
      .kpi-row { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .search-box input { width: 170px; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Barre du haut sombre façon maquette -->
  <header class="top-header">
    <div class="top-auth">
      <button class="auth-btn" onclick="alert('Espace éditrice — Lune et Papier Éditions')">

    <div class="brand-mark" onclick="app.setNav('projects')">

        <path d="M29 8l1.2 3.3L33.5 12.5l-3.3 1.2L29 17l-1.2-3.3-3.3-1.2 3.3-1.2L29 8Z" fill="#F8FAFC"/>

      </svg>

  <div class="body-grid">
    <!-- Menu latéral gauche -->
    <aside class="sidebar" id="sidebar">
      <button class="nav-item" data-nav="dashboard" onclick="app.setNav('dashboard')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Tableau de bord</span>
      </button>

      <button class="nav-item active" data-nav="projects" onclick="app.setNav('projects')">

      <button class="nav-item" data-nav="editorial" onclick="app.setNav('editorial')">

    </aside>

    <!-- Contenu dynamique -->
    <main class="content-pane" id="main-content"></main>

</div>

<!-- Modale Création d'un projet -->
<div class="modal-backdrop" id="modal-new-project">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 class="serif-title" style="font-size:1.45rem;">Nouveau projet d'album</h2>
      <button class="btn-secondary" onclick="app.closeModal()">✕</button>
    </div>
    <form onsubmit="app.createProject(event)">
      <div class="form-grid">
        <div class="field full">
          <label>Titre du projet (ou idée avant écriture)</label>
          <input name="title" required placeholder="Ex. Les aventures de Lilou le lapin de Pâques" />
        </div>
        <div class="field">
          <label>Auteur / Auteure</label>
          <input name="author" required placeholder="Ex. Anne-Sophie Guerout" />
        </div>
        <div class="field">
          <label>Type de projet</label>
          <select name="type">
            <option value="Album maison">Album maison</option>
            <option value="Auteur partenaire">Auteur partenaire</option>
            <option value="Commande illustration">Commande illustration</option>
          </select>
        </div>
        <div class="field">
          <label>Phase de départ</label>
          <select name="startPhase">
            <option value="0">Phase 0 — Amont &amp; Idée (avant texte)</option>
            <option value="1">Phase 1 — Écriture &amp; Édition</option>
            <option value="2">Phase 2 — Storyboard &amp; Cadrage</option>
            <option value="3">Phase 3 — Illustrations &amp; Maquette</option>
            <option value="4">Phase 4 — Fabrication, BnF &amp; Dilicom</option>
          </select>
        </div>
        <div class="field">
          <label>Date limite / Sortie visée</label>
          <input name="deadline" placeholder="Ex. 15 Mars 2027" />
        </div>
        <div class="field">
          <label>Technique graphique</label>
          <select name="technique">
            <option value="Aquarelle">Aquarelle</option>
            <option value="Numérique">Numérique</option>
            <option value="Peinture">Peinture</option>
            <option value="Crayon aquarellable">Crayon aquarellable</option>
          </select>
        </div>
        <div class="field">
          <label>Statut initial</label>
          <select name="status">
            <option value="En cours">En cours</option>
            <option value="En attente">En attente</option>
            <option value="Planifié">Planifié</option>
            <option value="Idée / Amont">Idée / Amont</option>
          </select>
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button type="button" class="btn-secondary" onclick="app.closeModal()">Annuler</button>
        <button type="submit" class="btn-new">Créer le workflow</button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'lune_papier_workflow_v1';

  const PHASES_TEMPLATE = [
    {
      num: 0,
      title: 'Phase 0 — Amont & Idéation (avant écriture du texte)',
      steps: [
        'Émergence de l’idée, thème & intention jeunesse',
        'Alignement ligne éditoriale (vocabulaire riche, lecture à voix haute, potentiel visuel)',
        'Recherche de texte / échange concept auteur ou ébauche personnelle'
      ]
    },
    {
      num: 1,
      title: 'Phase 1 — Écriture, Édition & Préparation du Texte',
      steps: [
        'Rédaction / réception du manuscrit (V1) & lecture à voix haute',
        'Note éditoriale (structure, rythme, personnages, vocabulaire)',
        'Réécriture & validation du texte (V2 / V3)',
        'Préparation de copie, relecture ortho-typographique & verrouillage du texte'
      ]
    },
    {
      num: 2,
      title: 'Phase 2 — Cadrage Artistique, Storyboard & Contrats',
      steps: [
        'Brief créatif & moodboard (palette & ambiance)',
        'Storyboard double-page par double-page (rythme & page-turn)',
        'Devis & signature des contrats (illustration / partenariat auteur)',
        'Character design (personnages, expressions & postures)'
      ]
    },
    {
      num: 3,
      title: 'Phase 3 — Création des Illustrations & Maquettage',
      steps: [
        'Crayonnés des planches & de la couverture',
        'Mise en couleur (aquarelle, numérique, peinture ou crayon aquarellable)',
        'Maquette intérieure, typographie & couverture complète (1re, dos, 4e)',
        'Pré-presse & export des fichiers HD (300 DPI, CMJN, fonds perdus)'
      ]
    },
    {
      num: 4,
      title: 'Phase 4 — Fabrication, Dépôt Légal & Dilicom / Electre',
      steps: [
        'Attribution ISBN (segment AFNIL), code-barres EAN-13 & ours légal (Loi 1949 / Loi Lang)',
        'Paramétrage imprimeur / BoD & validation du BAT physique',
        'Dépôt légal BnF (déclaration & envoi exemplaire)',
        'Fiche Electre & vérification disponibilité commande sur Dilicom'
      ]
    },
    {
      num: 5,
      title: 'Phase 5 — Lancement, Diffusion & Commercialisation',
      steps: [
        'Fiche produit boutique, fiche argumentaire libraire & Cover Reveal',
        'Précommandes & envoi des Services de Presse (SP)',
        'Ventes directes, salons, librairies indépendantes & Cultura/Fnac'
      ]
    }
  ];

  function buildSteps(completedCount) {
    const all = [];
    PHASES_TEMPLATE.forEach(ph => {
      ph.steps.forEach((label, idx) => {
        const globalIdx = all.length;
        const isDone = globalIdx < completedCount;
        all.push({
          id: 'st_' + ph.num + '_' + idx + '_' + Math.random().toString(36).slice(2, 6),
          phaseNum: ph.num,
          phaseTitle: ph.title,
          label,
          state: isDone ? 'Terminé' : (globalIdx === completedCount ? 'En cours' : 'À venir'),
          note: ''
        });
      });
    });
    return all;
  }

  function defaultData() {
    return {
      nav: 'projects',
      search: '',
      selectedProjectId: null,
      projects: [
        {
          id: 'p_lilou',
          title: 'Les aventures de Lilou le lapin de Pâques',
          author: 'Anne-Sophie Guerout',
          type: 'Album maison',
          phaseLabel: 'Maquette',
          deadline: '15 Mars 2027',
          technique: 'Aquarelle',
          status: 'En cours',
          steps: buildSteps(14)
        },
        {
          id: 'p_murphy',
          title: 'Murphy & Aglaé : Soif de héros',
          author: 'Paméla Ivanes',
          type: 'Auteur partenaire',
          phaseLabel: 'Storyboard',
          deadline: '20 Avr 2027',
          technique: 'Numérique',
          status: 'En attente',
          steps: buildSteps(9)
        },
        {
          id: 'p_noel',
          title: 'Une maison pour Noël',
          author: 'Anne-Sophie Guerout',
          type: 'Album maison',
          phaseLabel: 'Correction',
          deadline: '15 Oct 2027',
          technique: 'Aquarelle',
          status: 'BAT Validé',
          steps: buildSteps(19)
        },
        {
          id: 'p_foret',
          title: 'Le secret des feuilles d’automne',
          author: 'À définir',
          type: 'Album maison',
          phaseLabel: 'Idée / Amont',
          deadline: '01 Sept 2027',
          technique: 'Aquarelle',
          status: 'Planifié',
          steps: buildSteps(1)
        }
      ]
    };
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      return { ...defaultData(), ...JSON.parse(raw) };
    } catch {
      return defaultData();
    }
  }

  let db = loadData();

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function calcProgress(project) {
    if (!project.steps || !project.steps.length) return 0;
    const done = project.steps.filter(s => s.state === 'Terminé').length;
    return Math.round((done / project.steps.length) * 100);
  }

  function statusPill(status) {
    const map = {
      'En cours': 'pill-encours',
      'En attente': 'pill-attente',
      'BAT Validé': 'pill-valide',
      'Terminé': 'pill-valide',
      'Planifié': 'pill-planifie',
      'Idée / Amont': 'pill-amont'
    };
    const cls = map[status] || 'pill-encours';
    return `<span class="pill ${cls}">${esc(status)}</span>`;
  }

  function renderProjectsDashboard() {
    const q = (db.search || '').toLowerCase().trim();
    const filtered = db.projects.filter(p =>
      !q ||
      p.title.toLowerCase().includes(q) ||
      p.author.toLowerCase().includes(q) ||
      p.phaseLabel.toLowerCase().includes(q) ||
      p.status.toLowerCase().includes(q)
    );

    const activeCount = db.projects.length;
    const editionCount = db.projects.filter(p => calcProgress(p) < 60).length;
    const fabCount = db.projects.filter(p => calcProgress(p) >= 60).length;

    return `
      <div class="section-head">
        <h1 class="serif-title">Projets en cours</h1>
        <div class="head-controls">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Rechercher un projet..." value="${esc(db.search)}" oninput="app.onSearch(this.value)" />
          </div>
          <button class="btn-new" onclick="app.openModal()">+ Nouveau Projet</button>
        </div>
      </div>

      <div class="kpi-row">
        <div class="kpi-box k-amber">
          <div class="kpi-top">
            <span>Projets actifs</span>
            <span class="dots"><span class="dot"></span><span class="dot"></span></span>
          </div>
          <div class="kpi-number">${activeCount}</div>
          <div class="kpi-bar-track">
            <div class="kpi-bar-fill" style="width:68%; background:var(--ambre-attente);"></div>
          </div>
        </div>

        <div class="kpi-box k-violet">
          <div class="kpi-top">
            <span>En phase d’édition</span>
            <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
          </div>
          <div class="kpi-number">${editionCount}</div>
          <div class="kpi-bar-track">
            <div class="kpi-bar-fill" style="width:52%; background:var(--violet);"></div>
          </div>
        </div>

        <div class="kpi-box k-blue">
          <div class="kpi-top">
            <span>En fabrication &amp; suite</span>
            <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
          </div>
          <div class="kpi-number">${fabCount}</div>
          <div class="kpi-bar-track">
            <div class="kpi-bar-fill" style="width:45%; background:var(--bleu-roi);"></div>
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title">
          <span>Suivi des projets</span>
          <span style="font-size:0.8rem; color:var(--text-muted); font-weight:400;">Cliquez sur un projet pour ouvrir son workflow complet (de la Phase 0 amont à Dilicom/Electre)</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>TITRE</th>
                <th>AUTEUR</th>
                <th>PHASE</th>
                <th>DATE LIMITE</th>
                <th>PROGRESSION</th>
                <th>STATUT</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map(p => {
                const pct = calcProgress(p);
                return `
                  <tr class="project-row" onclick="app.openWorkflow('${p.id}')">
                    <td><strong>${esc(p.title)}</strong></td>
                    <td>${esc(p.author)}</td>
                    <td>${esc(p.phaseLabel)}</td>
                    <td>${esc(p.deadline || '—')}</td>
                    <td>
                      <div class="prog-cell">
                        <div class="mini-track"><div class="mini-fill" style="width:${pct}%;"></div></div>
                        <span>${pct}%</span>
                      </div>
                    </td>
                    <td>${statusPill(p.status)}</td>
                  </tr>
                `;
              }).join('')}
              ${!filtered.length ? `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:24px;">Aucun projet ne correspond à votre recherche.</td></tr>` : ''}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderWorkflowView() {
    const project = db.projects.find(p => p.id === db.selectedProjectId) || db.projects[0];
    if (!project) return renderProjectsDashboard();

    const pct = calcProgress(project);

    return `
      <div class="workflow-top">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <button class="btn-secondary" onclick="app.backToProjects()">← Retour aux projets</button>
          <div>
            <h1 class="serif-title" style="font-size:1.65rem;">${esc(project.title)}</h1>
            <div style="font-size:0.84rem; color:var(--text-muted);">
              ${esc(project.author)} • ${esc(project.type)} • Technique : ${esc(project.technique)} • Échéance : ${esc(project.deadline || 'À définir')}
            </div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <select class="step-select" style="padding:7px 10px; font-weight:600;" onchange="app.changeProjectStatus('${project.id}', this.value)">
            ${['Idée / Amont','Planifié','En cours','En attente','BAT Validé','Terminé'].map(st =>
              `<option value="${st}" ${project.status === st ? 'selected' : ''}>Statut : ${st}</option>`
            ).join('')}
          </select>
          <span class="pill pill-encours" style="background:var(--bleu-roi); font-size:0.86rem;">${pct}% complété</span>
        </div>
      </div>

      <div class="panel-card" style="padding:14px 18px; margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; font-size:0.84rem; margin-bottom:6px;">
          <span><strong>Avancement global du workflow (Phase 0 amont → Lancement)</strong></span>
          <span>${project.steps.filter(s => s.state === 'Terminé').length} / ${project.steps.length} étapes terminées</span>
        </div>
        <div class="kpi-bar-track" style="height:8px;">
          <div class="kpi-bar-fill" style="width:${pct}%; background:linear-gradient(90deg, var(--violet), var(--bleu-roi));"></div>
        </div>
      </div>

      ${PHASES_TEMPLATE.map(ph => {
        const steps = project.steps.filter(s => s.phaseNum === ph.num);
        const phDone = steps.filter(s => s.state === 'Terminé').length;
        return `
          <div class="phase-card">
            <div class="phase-header">
              <span class="phase-name">${esc(ph.title)}</span>
              <span style="font-size:0.8rem; font-weight:600; color:var(--bleu-cobalt);">${phDone}/${steps.length} validées</span>
            </div>
            ${steps.map(st => {
              const isDone = st.state === 'Terminé';
              return `
                <div class="step-item">
                  <div class="step-left">
                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="app.toggleStep('${project.id}', '${st.id}')" />
                    <span class="step-title ${isDone ? 'done' : ''}">${esc(st.label)}</span>
                  </div>
                  <div class="step-controls">
                    <select class="step-select" onchange="app.setStepState('${project.id}', '${st.id}', this.value)">
                      ${['À venir','En cours','En attente de validation','Terminé','Bloqué'].map(opt =>
                        `<option value="${opt}" ${st.state === opt ? 'selected' : ''}>${opt}</option>`
                      ).join('')}
                    </select>
                    <input class="step-note" type="text" placeholder="Note / date..." value="${esc(st.note)}" onchange="app.setStepNote('${project.id}', '${st.id}', this.value)" />
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('')}
    `;
  }

  function renderSecondarySection() {
    const labels = {
      dashboard: 'Tableau de bord',
      editorial: 'Projets éditoriaux',
      manuscripts: 'Manuscrits & Auteurs',
      production: 'Production & Impression (BnF / Dilicom / Electre)',
      catalogue: 'Catalogue Lune & Papier',
      distribution: 'Ventes & Distribution',
      accounting: 'Comptabilité (BIC / BNC)',
      settings: 'Paramètres'
    };
    const title = labels[db.nav] || 'Espace Éditorial';

    return `
      <div class="section-head">
        <h1 class="serif-title">${esc(title)}</h1>
        <button class="btn-secondary" onclick="app.setNav('projects')">← Voir Projets en cours</button>
      </div>
      <div class="panel-card">
        <div class="panel-title">Accès rapide aux projets liés</div>
        <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:14px;">
          Retrouvez l’ensemble de vos albums actifs et cliquez sur n’importe lequel pour piloter ses étapes éditoriales, artistiques, BnF et Dilicom/Electre.
        </p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          ${db.projects.map(p => `
            <button class="btn-secondary" onclick="app.openWorkflow('${p.id}')">
              ${esc(p.title)} (${calcProgress(p)}%)
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  function render() {
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.nav === db.nav);
    });
    const main = document.getElementById('main-content');
    if (db.nav === 'workflow') {
      main.innerHTML = renderWorkflowView();
    } else if (db.nav === 'projects') {
      main.innerHTML = renderProjectsDashboard();
    } else {
      main.innerHTML = renderSecondarySection();
    }
  }

  window.app = {
    setNav(nav) {
      db.nav = nav;
      save();
      render();
    },
    onSearch(val) {
      db.search = val;
      save();
      render();
    },
    openModal() {
      document.getElementById('modal-new-project').classList.add('open');
    },
    closeModal() {
      document.getElementById('modal-new-project').classList.remove('open');
    },
    createProject(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const startPhase = parseInt(fd.get('startPhase') || '0', 10);
      const steps = buildSteps(0);
      // Marque les phases antérieures à startPhase comme terminées si démarré plus loin
      steps.forEach(s => {
        if (s.phaseNum < startPhase) s.state = 'Terminé';
      });
      const firstActive = steps.find(s => s.state !== 'Terminé');
      if (firstActive) firstActive.state = 'En cours';

      const phaseNames = ['Idée / Amont', 'Édition', 'Storyboard', 'Maquette', 'BnF / Dilicom', 'Lancement'];
      const newProj = {
        id: 'p_' + Date.now(),
        title: (fd.get('title') || '').trim(),
        author: (fd.get('author') || '').trim() || 'À définir',
        type: fd.get('type'),
        phaseLabel: phaseNames[startPhase] || 'Idée / Amont',
        deadline: (fd.get('deadline') || '').trim(),
        technique: fd.get('technique'),
        status: fd.get('status'),
        steps
      };
      db.projects.unshift(newProj);
      db.selectedProjectId = newProj.id;
      db.nav = 'workflow';
      save();
      e.target.reset();
      this.closeModal();
      render();
    },
    openWorkflow(id) {
      db.selectedProjectId = id;
      db.nav = 'workflow';
      save();
      render();
    },
    backToProjects() {
      db.nav = 'projects';
      save();
      render();
    },
    changeProjectStatus(id, status) {
      const p = db.projects.find(x => x.id === id);
      if (p) { p.status = status; save(); render(); }
    },
    toggleStep(projId, stepId) {
      const p = db.projects.find(x => x.id === projId);
      const s = p && p.steps.find(x => x.id === stepId);
      if (!s) return;
      s.state = (s.state === 'Terminé') ? 'À venir' : 'Terminé';
      save();
      render();
    },
    setStepState(projId, stepId, stateVal) {
      const p = db.projects.find(x => x.id === projId);
      const s = p && p.steps.find(x => x.id === stepId);
      if (s) { s.state = stateVal; save(); render(); }
    },
    setStepNote(projId, stepId, noteVal) {
      const p = db.projects.find(x => x.id === projId);
      const s = p && p.steps.find(x => x.id === stepId);
      if (s) { s.note = noteVal; save(); }
    }
  };

  render();
})();
</script>
</body>
</html>
