<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio éditorial Instagram</title>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-alt: #f0f2f8;
      --text: #181a20;
      --muted: #656b7b;
      --primary: #5b4ce6;
      --primary-hover: #4839d4;
      --primary-soft: #eeecfd;
      --accent-ig: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --border: #e3e6ef;
      --success: #168a54;
      --success-bg: #e7f7ef;
      --warn: #b4690e;
      --warn-bg: #fff5e5;
      --info: #1d5fd6;
      --info-bg: #e8f0fe;
      --radius: 12px;
      --shadow: 0 4px 18px rgba(24, 26, 32, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1420px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    nav.tabs {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: var(--surface-alt);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    main {
      max-width: 1420px;
      margin: 0 auto;
      padding: 24px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .kpi .label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .kpi .value {
      font-size: 23px;
      font-weight: 700;
      margin-top: 4px;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .view-switch {
      display: inline-flex;
      background: var(--surface-alt);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .view-switch button {
      border: none;
      background: transparent;
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 12px;
    }

    .view-switch button.active {
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      color: var(--primary);
    }

    select, input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea {
      font-family: inherit;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
    }

    select:focus, input:focus, textarea:focus {
      outline: 2px solid var(--primary-soft);
      border-color: var(--primary);
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--surface-alt);
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button.danger {
      color: #b42318;
      border-color: #fecdca;
      background: #fef3f2;
    }

    button.sm {
      padding: 5px 9px;
      font-size: 12px;
    }

    /* Vue Cartes */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 16px;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .post-thumb {
      height: 175px;
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      position: relative;
      overflow: hidden;
    }

    .post-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .format-pill {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(24, 26, 32, 0.78);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .post-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .post-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .status-badge {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .st-idée { background: var(--surface-alt); color: #475467; }
    .st-préparation { background: var(--warn-bg); color: var(--warn); }
    .st-validé { background: var(--info-bg); color: var(--info); }
    .st-programmé { background: var(--primary-soft); color: var(--primary); }
    .st-publié { background: var(--success-bg); color: var(--success); }

    .post-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .post-caption-preview {
      font-size: 13px;
      color: var(--muted);
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-tag {
      font-size: 11px;
      background: var(--surface-alt);
      padding: 2px 8px;
      border-radius: 6px;
      color: var(--text);
    }

    .post-actions {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    /* Vue Calendrier Mensuel */
    .calendar-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }
